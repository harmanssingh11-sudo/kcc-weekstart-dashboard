<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KCC Weekstart Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root{--bg:#f4f5f8;--card:#fff;--ink:#1c2333;--muted:#6b7280;--line:#e4e7ec;--brand:#4f46e5;--ok:#0f9d58;--bad:#d93025;--warn:#b26a00}
  *{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);padding:24px 16px}.wrap{max-width:1280px;margin:0 auto}
  header.top,.panel,.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px}header.top{padding:22px 24px;margin-bottom:16px}header.top h1{font-size:1.5rem}header.top p{color:var(--muted);margin-top:4px}.panel{padding:20px 24px;margin-bottom:16px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;align-items:end}label{display:block;font-size:.78rem;font-weight:600;text-transform:uppercase;color:var(--muted);margin-bottom:6px}input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff}button{padding:10px 18px;border:0;border-radius:8px;background:var(--brand);color:#fff;font:inherit;font-weight:600;cursor:pointer}.ghost{background:#eef0f6;color:var(--ink);padding:6px 12px;font-size:.85rem}.presets{margin-top:14px;display:flex;gap:8px;flex-wrap:wrap}.muted{color:var(--muted)}.msg{margin-top:14px;padding:11px 14px;border-radius:8px;display:none}.msg.show{display:block}.msg.warn{background:#fff5e0;color:#7a4a00}.msg.err{background:#fdecea;color:#8c1d18}.msg.ok{background:#e7f5ec;color:#0b6b3a}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:16px}.kpi{border-left:4px solid var(--brand);padding:18px 20px}.kpi .l{font-size:.75rem;text-transform:uppercase;color:var(--muted);font-weight:600}.kpi .v{font-size:2rem;font-weight:700;margin-top:6px}.kpi.ok{border-left-color:var(--ok)}.kpi.bad{border-left-color:var(--bad)}.grid{display:grid;grid-template-columns:2fr 1fr;gap:16px}.hidden{display:none}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:.9rem}.chart{min-height:280px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style>
</head><body><div class="wrap"><header class="top"><h1>KCC Weekstart Dashboard</h1><p>Upload een Power BI-export, kies een periode en segment. Het bestand blijft alleen in deze browser.</p></header>
<section class="panel"><div class="controls"><div><label>Excelbestand<input id="file" type="file" accept=".xlsx,.xls"></label></div><div><label>Datum van<input id="from" type="date"></label></div><div><label>Datum t/m<input id="to" type="date"></label></div><div><label>Segment<select id="segment"><option>Inbound</option><option>Outbound</option><option>Receptie calls</option></select></label></div><div><button id="build">Maak dashboard</button></div></div><div class="presets"><button class="ghost" data-p="all">Hele bestand</button><button class="ghost" data-p="prev">Vorige week</button><button class="ghost" data-p="week">Deze week</button><button class="ghost" data-p="month">Deze maand</button></div><div id="msg" class="msg"></div></section>
<div id="dashboard" class="hidden"><div class="kpis"><div class="kpi"><div class="l">Totaal calls</div><div class="v" id="total">—</div></div><div class="kpi ok"><div class="l">Aangenomen</div><div class="v" id="answered">—</div></div><div class="kpi bad"><div class="l">Gemist</div><div class="v" id="missed">—</div></div><div class="kpi"><div class="l">Bereikbaarheid</div><div class="v" id="rate">—</div></div></div><div class="grid"><section class="panel"><h2>Dagelijkse trend</h2><div class="chart"><canvas id="dailyChart"></canvas></div></section><section class="panel"><h2>Verdeling</h2><div class="chart"><canvas id="donutChart"></canvas></div></section></div><section class="panel"><h2>Top 3 medewerkers</h2><table><thead><tr><th>#</th><th>Medewerker</th><th>Aangenomen</th></tr></thead><tbody id="top"></tbody></table></section><section class="panel"><h2>Per dag</h2><table><thead><tr><th>Datum</th><th>Totaal</th><th>Aangenomen</th><th>Gemist</th></tr></thead><tbody id="days"></tbody></table></section></div></div>
<script>
const $=id=>document.getElementById(id);let wb=null,charts=[];
function show(t,c='ok'){const e=$('msg');e.className='msg show '+c;e.textContent=t}
function dateFromSheet(n){let m=String(n).match(/^(\d{1,2})[-_](\d{1,2})(?:[-_](\d{4}))?$/);if(!m)return null;return new Date(Number(m[3]||2026),Number(m[2])-1,Number(m[1]));}
function iso(d){return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function num(v){if(typeof v==='number')return v;let s=String(v??'').trim().replace(/\./g,'').replace(',','.');return Number(s)||0}
function norm(v){return String(v??'').trim().toLowerCase()}
function col(headers,words){return headers.findIndex(h=>words.some(w=>norm(h).includes(w)))}
function segmentRows(rows,segment){let start=0,end=rows.length;for(let i=0;i<rows.length;i++){let x=norm(rows[i][0]);if(segment==='Inbound'){if(x==='outbound'||x==='bereikbaarheid'||x==='receptie calls'){end=i;break}}else if(x===norm(segment)){start=i+1;for(let j=start;j<rows.length;j++){let y=norm(rows[j][0]);if(y==='bereikbaarheid'||y==='receptie calls'||y==='outbound'){if(y!==norm(segment)){end=j;break}}}}return rows.slice(start,end)}
function parseSheet(name){const rows=XLSX.utils.sheet_to_json(wb.Sheets[name],{header:1,defval:''});const seg=$('segment').value;const block=segmentRows(rows,seg);let h=-1;for(let i=0;i<Math.min(block.length,8);i++){if(col(block[i],['agent','medewerker','naam'])>=0){h=i;break}}if(h<0)return null;const headers=block[h];const ac=col(headers,['agent','medewerker','naam']),vc=col(headers,['volume','calls','totaal']),acc=col(headers,['accepted','aangenomen','beantwoord']),mc=col(headers,['missed','gemist']);let agents={},total=0,answered=0,missed=0,foundTotal=null;for(let i=h+1;i<block.length;i++){let r=block[i],first=norm(r[0]);if(first==='total'){foundTotal={total:vc>=0?num(r[vc]):0,answered:acc>=0?num(r[acc]):0,missed:mc>=0?num(r[mc]):0};break}let agent=String(r[ac]??'').trim();if(!agent)continue;let v=vc>=0?num(r[vc]):0,a=acc>=0?num(r[acc]):0,m=mc>=0?num(r[mc]):0;total+=v;answered+=a;missed+=m;agents[agent]=(agents[agent]||0)+a}if(foundTotal){if(Math.abs(total-foundTotal.total)>0.01)show(`${name}: Total-regel wijkt af van de som van medewerkers; Total-regel wordt gebruikt.`,'warn');return {...foundTotal,agents}}return {total,answered,missed,agents}}
$('file').addEventListener('change',async e=>{const f=e.target.files[0];if(!f)return;wb=XLSX.read(await f.arrayBuffer(),{type:'array'});let ds=wb.SheetNames.map(dateFromSheet).filter(Boolean).sort((a,b)=>a-b);if(ds.length){$('from').value=iso(ds[0]);$('to').value=iso(ds.at(-1))}show('Bestand geladen. Kies periode en segment en maak het dashboard.')});
document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{let ds=wb?wb.SheetNames.map(dateFromSheet).filter(Boolean).sort((a,b)=>a-b):[];if(!ds.length){show('Upload eerst een bestand.','err');return}let a=ds[0],z=ds.at(-1),p=b.dataset.p;if(p==='prev'||p==='week'){let n=new Date();let mon=new Date(n);mon.setDate(n.getDate()-((n.getDay()+6)%7));if(p==='prev')mon.setDate(mon.getDate()-7);a=mon;z=new Date(mon);z.setDate(mon.getDate()+6)}if(p==='month'){let n=new Date();a=new Date(n.getFullYear(),n.getMonth(),1);z=new Date(n.getFullYear(),n.getMonth()+1,0)}$('from').value=iso(a);$('to').value=iso(z)});
$('build').onclick=()=>{if(!wb){show('Upload eerst een Excelbestand.','err');return}let from=new Date($('from').value+'T00:00:00'),to=new Date($('to').value+'T00:00:00');if(isNaN(from)||isNaN(to)||from>to){show('Kies een geldige periode.','err');return}let max=62*86400000;if(to-from>max){show('Maximaal 62 dagen per dashboard.','err');return}let days=[],people={},T=0,A=0,M=0,missing=[];for(let n of wb.SheetNames){let d=dateFromSheet(n);if(!d||d<from||d>to)continue;let x=parseSheet(n);if(!x){missing.push(n);continue}days.push({name:n,...x});T+=x.total;A+=x.answered;M+=x.missed;for(let [k,v] of Object.entries(x.agents))people[k]=(people[k]||0)+v}if(!days.length){show('Geen bruikbare dagtabbladen gevonden in deze periode.','err');return}$('total').textContent=T.toLocaleString('nl-NL');$('answered').textContent=A.toLocaleString('nl-NL');$('missed').textContent=M.toLocaleString('nl-NL');$('rate').textContent=T?(A/T*100).toFixed(1)+'%':'—';$('top').innerHTML=Object.entries(people).sort((a,b)=>b[1]-a[1]).slice(0,3).map((x,i)=>`<tr><td>${i+1}</td><td>${x[0]}</td><td>${x[1].toLocaleString('nl-NL')}</td></tr>`).join('');$('days').innerHTML=days.map(d=>`<tr><td>${d.name}</td><td>${d.total.toLocaleString('nl-NL')}</td><td>${d.answered.toLocaleString('nl-NL')}</td><td>${d.missed.toLocaleString('nl-NL')}</td></tr>`).join('');charts.forEach(c=>c.destroy());charts=[];charts.push(new Chart($('dailyChart'),{type:'bar',data:{labels:days.map(d=>d.name),datasets:[{label:'Aangenomen',data:days.map(d=>d.answered)},{label:'Gemist',data:days.map(d=>d.missed)}]},options:{responsive:true,maintainAspectRatio:false}}));charts.push(new Chart($('donutChart'),{type:'doughnut',data:{labels:['Aangenomen','Gemist'],datasets:[{data:[A,M]}]},options:{responsive:true,maintainAspectRatio:false}}));$('dashboard').classList.remove('hidden');show(`Dashboard gemaakt voor ${iso(from)} t/m ${iso(to)} – ${$('segment').value}. ${missing.length?'Geen data gevonden in: '+missing.join(', '):'Alle beschikbare dagen meegenomen.'}`,missing.length?'warn':'ok')};
</script></body></html>
