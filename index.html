<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KCC Weekstart Dashboard</title><script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script><style>body{font-family:system-ui,sans-serif;background:#f4f5f8;color:#1c2333;margin:0;padding:24px}.wrap{max-width:1280px;margin:auto}.panel,.kpi{background:#fff;border:1px solid #e4e7ec;border-radius:14px;padding:20px;margin-bottom:16px}.controls,.kpis,.grid,.highlights{display:grid;gap:14px}.controls{grid-template-columns:repeat(auto-fit,minmax(180px,1fr));align-items:end}.kpis{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.grid,.highlights{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:#6b7280}input,select,button{width:100%;padding:10px;border-radius:8px;border:1px solid #dfe4ee;font:inherit}button{background:#4f46e5;color:white;border:0;font-weight:700;cursor:pointer}.ghost{width:auto;background:#eef0f6;color:#1c2333;margin:8px 6px 0 0}.kpi .l{font-size:.75rem;text-transform:uppercase;color:#6b7280}.kpi .v{font-size:2rem;font-weight:800;margin-top:6px}.bad{border-left:4px solid #d93025}.ok{border-left:4px solid #0f9d58}.hide{display:none}.msg{padding:12px;border-radius:8px;background:#eef0f6;margin-top:14px}.warn{background:#fff5e0;color:#7a4a00}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #e4e7ec;text-align:left}.num{text-align:right}.chart{height:300px}.hl{border:1px solid #e4e7ec;border-radius:12px;padding:16px}.hl h3{margin-top:0;font-size:1rem}.muted{color:#6b7280;font-size:.85rem}</style></head><body><div class="wrap"><h1>KCC Weekstart Dashboard</h1><p class="muted">Excel wordt alleen lokaal in de browser verwerkt.</p><section class="panel"><div class="controls"><div><label>Excel-export</label><input id="file" type="file" accept=".xlsx,.xls,.xlsm"></div><div><label>Segment</label><select id="segment"><option>Inbound</option><option>Outbound</option><option>Receptie</option></select></div><div><label>Datum van</label><input id="from" type="date"></div><div><label>Datum t/m</label><input id="to" type="date"></div><button id="run">Maak dashboard</button></div><div><button class="ghost" data-p="all">Hele bestand</button><button class="ghost" data-p="lastweek">Vorige week (ma–za)</button><button class="ghost" data-p="thisweek">Deze week</button></div><div id="msg" class="msg">Upload een Power BI-export.</div></section><div id="out" class="hide"><div class="kpis" id="kpis"></div><section class="panel"><h2>Bijzonderheden</h2><div class="highlights" id="highlights"></div></section><div class="grid"><section class="panel"><h2>Volume per dag</h2><div class="chart"><canvas id="chart"></canvas></div></section><section class="panel"><h2>Top medewerkers</h2><table id="agents"></table></section></div><section class="panel"><h2>Per dag</h2><table id="days"></table></section></div></div><script>let wb,sheets=[],chart;const $=x=>document.getElementById(x),pad=x=>String(x).padStart(2,'0'),year=new Date().getFullYear();function say(t,w=false){$('msg').textContent=t;$('msg').className='msg'+(w?' warn':'')}function parse(n){let m=String(n).trim().match(/^(\d{1,2})[-/.](\d{1,2})$/);return m?{name:n,day:+m[1],month:+m[2]}:null}function iso(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function num(v){if(typeof v==='number')return v||0;return Number(String(v??'').replace(/\./g,'').replace(',','.').replace(/[^0-9.-]/g,''))||0}function blocks(rows){let out=[],label='Inbound',cur=null;for(const r of rows){let a=String(r[0]??'').trim(),title=a&&r.slice(1).every(x=>x==null||x==='');if(title&&!/^agents$/i.test(a)&&!/^total$/i.test(a)){label=a;cur=null;continue}if(/^agents$/i.test(a)){cur={label,header:r.map(x=>String(x??'').trim()),rows:[],total:null};out.push(cur);continue}if(cur&&/^total$/i.test(a)){cur.total=r;cur=null;continue}if(cur&&a)cur.rows.push(r)}return out}function read(sheet,seg){let bs=blocks(XLSX.utils.sheet_to_json(sheet,{header:1,defval:null})),b=seg==='Inbound'?bs.find(x=>/^inbound$/i.test(x.label)):bs.find(x=>new RegExp('^'+seg,'i').test(x.label));if(!b)return null;let f=w=>{let i=b.header.findIndex(h=>w.some(q=>h.toLowerCase().includes(q)));return i};let ac=0,vc=f(['volume']),an=f(['accepted','aangenomen','beantwoord']),mi=f(['missed','gemist']);let people=b.rows.map(r=>({name:String(r[ac]??'').trim(),volume:num(r[vc]),accepted:num(r[an]),missed:num(r[mi])})).filter(x=>x.name);let sum=people.reduce((a,x)=>({volume:a.volume+x.volume,accepted:a.accepted+x.accepted,missed:a.missed+x.missed}),{volume:0,accepted:0,missed:0});let t=b.total?{volume:num(b.total[vc]),accepted:num(b.total[an]),missed:num(b.total[mi])}:sum;return{people,totals:t}}$('file').onchange=async e=>{wb=XLSX.read(await e.target.files[0].arrayBuffer(),{type:'array'});sheets=wb.SheetNames.map(parse).filter(Boolean).sort((a,b)=>a.month-b.month||a.day-b.day);if(!sheets.length)return say('Geen dagtabbladen zoals 17-08 gevonden.',true);$('from').value=`${year}-${pad(sheets[0].month)}-${pad(sheets[0].day)}`;$('to').value=`${year}-${pad(sheets.at(-1).month)}-${pad(sheets.at(-1).day)}`;say(sheets.length+' dagtabbladen geladen.')}document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{if(!sheets.length)return;let p=b.dataset.p;if(p==='all'){$('from').value=`${year}-${pad(sheets[0].month)}-${pad(sheets[0].day)}`;$('to').value=`${year}-${pad(sheets.at(-1).month)}-${pad(sheets.at(-1).day)}`;return}let d=new Date(),mon=new Date(d);mon.setDate(d.getDate()-((d.getDay()+6)%7));if(p==='lastweek')mon.setDate(mon.getDate()-7);let end=new Date(mon);end.setDate(mon.getDate()+5);$('from').value=iso(mon);$('to').value=iso(end)})$('run').onclick=()=>{if(!wb)return say('Upload eerst een Excelbestand.',true);let from=$('from').value,to=$('to').value,seg=$('segment').value;if(!from||!to||from>to)return say('Kies een geldige periode.',true);let days=[],people=new Map(),all={Inbound:[],Outbound:[],Receptie:[]};for(const s of sheets){let d=`${year}-${pad(s.month)}-${pad(s.day)}`;if(d<from||d>to)continue;for(const z of Object.keys(all)){let x=read(wb.Sheets[s.name],z);if(x)all[z].push(...x.people.map(p=>({...p,day:s.name})))}let x=read(wb.Sheets[s.name],seg);if(!x)continue;days.push({date:s.name,...x.totals});x.people.forEach(p=>{let q=people.get(p.name)||{name:p.name,accepted:0,missed:0,volume:0};q.accepted+=p.accepted;q.missed+=p.missed;q.volume+=p.volume;people.set(p.name,q)})}if(!days.length)return say('Geen data gevonden voor deze periode/dit segment.',true);let total=days.reduce((a,x)=>a+x.volume,0),accepted=days.reduce((a,x)=>a+x.accepted,0),missed=days.reduce((a,x)=>a+x.missed,0),rate=total?accepted/total:0,n=x=>x.toLocaleString('nl-NL');$('kpis').innerHTML=`<div class="kpi"><div class="l">Totaal aangeboden</div><div class="v">${n(total)}</div></div><div class="kpi ok"><div class="l">Aangenomen</div><div class="v">${n(accepted)}</div></div><div class="kpi bad"><div class="l">Gemist</div><div class="v">${n(missed)}</div></div><div class="kpi"><div class="l">Acceptatie</div><div class="v">${(rate*100).toFixed(1).replace('.',',')}%</div></div>`;let rows=[...people.values()].sort((a,b)=>b.accepted-a.accepted);$('agents').innerHTML='<thead><tr><th>#</th><th>Medewerker</th><th class="num">Aangenomen</th><th class="num">Gemist</th></tr></thead><tbody>'+rows.map((x,i)=>`<tr><td>${i+1}</td><td>${x.name.replace(/@.*$/,'')}</td><td class="num">${n(x.accepted)}</td><td class="num">${n(x.missed)}</td></tr>`).join('')+'</tbody>';$('days').innerHTML='<thead><tr><th>Datum</th><th class="num">Totaal</th><th class="num">Aangenomen</th><th class="num">Gemist</th></tr></thead><tbody>'+days.map(x=>`<tr><td>${x.date}</td><td class="num">${n(x.volume)}</td><td class="num">${n(x.accepted)}</td><td class="num">${n(x.missed)}</td></tr>`).join('')+'</tbody>';let card=(title,arr,key)=>`<div class="hl"><h3>${title}</h3><ol>${[...arr].sort((a,b)=>b[key]-a[key]).slice(0,3).map(x=>`<li>${x.name.replace(/@.*$/,'')} — <b>${n(x[key])}</b></li>`).join('')||'<li>Geen data</li>'}</ol></div>`;$('highlights').innerHTML=card('Top 3 gemiste hunts',all.Inbound,'missed')+card('Top 3 receptie calls',all.Receptie,'accepted')+card('Top 3 outbound calls',all.Outbound,'accepted');if(chart)chart.destroy();chart=new Chart($('chart'),{type:'bar',data:{labels:days.map(x=>x.date),datasets:[{label:'Aangenomen',data:days.map(x=>x.accepted)},{label:'Gemist',data:days.map(x=>x.missed)}]},options:{responsive:true,maintainAspectRatio:false,scales:{x:{stacked:true},y:{stacked:true,beginAtZero:true}}}});$('out').classList.remove('hide');say(`Dashboard gemaakt: ${from} t/m ${to}, ${seg}.`)}</script></body></html>
